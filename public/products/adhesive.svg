<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" role="img" aria-label="Tube of universal super glue">
  <title>Tube of universal super glue</title>

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="38%" stop-color="#ef4444"/>
      <stop offset="62%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="40%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- cap -->
  <rect x="82" y="14" width="36" height="46" rx="6" fill="url(#cap)"/>
  <rect x="86" y="20" width="6" height="34" rx="3" fill="#ffffff" opacity="0.28"/>

  <!-- neck -->
  <rect x="88" y="58" width="24" height="18" fill="#6b7280"/>
  <rect x="84" y="72" width="32" height="10" rx="3" fill="#4b5563"/>

  <!-- shoulders into body -->
  <path d="M84 82 C84 96 62 104 60 124 L60 284 a10 10 0 0 0 10 10 l60 0 a10 10 0 0 0 10 -10 L140 124 C138 104 116 96 116 82 Z"
        fill="url(#body)"/>

  <!-- crimped seal at the base -->
  <rect x="58" y="286" width="84" height="16" rx="4" fill="#7f1d1d"/>
  <g fill="#991b1b">
    <rect x="66" y="289" width="4" height="10" rx="2"/>
    <rect x="78" y="289" width="4" height="10" rx="2"/>
    <rect x="90" y="289" width="4" height="10" rx="2"/>
    <rect x="102" y="289" width="4" height="10" rx="2"/>
    <rect x="114" y="289" width="4" height="10" rx="2"/>
    <rect x="126" y="289" width="4" height="10" rx="2"/>
  </g>

  <!-- label -->
  <rect x="62" y="150" width="76" height="96" rx="5" fill="url(#label)"/>

  <!-- droplet bonding two halves: the mark, drawn rather than lettered -->
  <path d="M100 172 c0 0 15 14 15 24 a15 15 0 1 1 -30 0 c0 -10 15 -24 15 -24 Z" fill="#dc2626"/>
  <rect x="72" y="214" width="56" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="80" y="226" width="40" height="5" rx="2.5" fill="#e2e8f0"/>

  <!-- highlight down the tube -->
  <path d="M72 120 C70 132 70 140 70 150 L70 280" stroke="#ffffff" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
